<!DOCTYPE html>
<!--

  Viewer page served by fsmview.py: the selected machines stacked below
  each other, the current state and the edge just taken in the highlight
  color, the last N steps fading toward the graph's neutral colors.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fsmview</title>
<style>
:root {
    --hl: hsl(140 65% 32%); /* outline of the current state and edge label */
    --run: hsl(215 80% 45%); /* a composite state running its submachine, and the path into it */
    --nested: #eef2ff;       /* fsm::writeDot's fill of a composite state: a submachine's panel takes it */
    --running: hsl(215 80% 88%); /* the fill of a composite state running its submachine, and of that panel */
}
* { box-sizing: border-box; }
body {
    margin: 0; height: 100vh; display: grid; grid-template-rows: auto auto 1fr auto;
    font: 14px system-ui, sans-serif; color: #202020; background: #f7f7f7;
}
header {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 6px 12px; background: #1f2937; color: #fff;
}
header .title { font-weight: 600; margin-right: 8px; }
header .muted { color: #cbd5e1; font-size: 12px; }
#machines { display: flex; gap: 4px; flex-wrap: wrap; }
#machines button {
    background: #374151; color: #9ca3af; border: 0; border-radius: 4px; padding: 4px 10px;
    cursor: pointer; font: inherit; text-decoration: line-through;
}
#machines button.shown { background: #4b5563; color: #fff; text-decoration: none; }
#machines #every { background: transparent; border: 1px solid #6b7280; color: #cbd5e1; text-decoration: none; }
#status { margin-left: auto; display: flex; gap: 12px; align-items: center; }
#live {
    border: 1px solid #9ca3af; border-radius: 10px; padding: 1px 10px; color: #9ca3af;
    background: transparent; cursor: pointer; font: inherit; font-size: 12px;
}
#live.on { border-color: #4ade80; color: #4ade80; }
#current { font-family: monospace; }
#warnings {
    display: none; padding: 4px 12px; background: #fde68a; color: #78350f;
    font-size: 12px; max-height: 6em; overflow: auto; white-space: pre-line;
}
main { display: grid; grid-template-columns: 1fr 10px var(--log-width, 360px); min-height: 0; }
/* with nothing to show in the log, the graphs take its room */
main.no-log { grid-template-columns: 1fr; }
main.no-log #splitter, main.no-log #log { display: none; }
/* drag to resize the log, double-click for the default width; the wheel
   over it scrolls the stack of graphs (over a graph the wheel zooms) */
#splitter { cursor: col-resize; background: #e5e7eb; }
#splitter:hover, #splitter.dragging { background: #9ca3af; }
#graph { overflow: auto; padding: 10px; display: flex; flex-direction: column; gap: 14px; position: relative; }
/* the path the events take now, drawn over the stack from a running
   composite state to its submachine's state */
#links { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
#links path { fill: none; stroke: var(--run); stroke-width: 2; stroke-dasharray: 7 4; }
#links polygon { fill: var(--run); }
.panel { border: 1px solid #ddd; border-radius: 6px; background: #fff; padding: 6px 10px; }
/* a submachine's panel is tinted like the composite state that runs it;
   Graphviz paints a white background polygon first in the graph's group */
.panel.nested { background: var(--nested); }
.panel.nested.running { background: var(--running); }
.panel.nested svg > g.graph > polygon { fill: transparent; }
.panel h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; display: flex; gap: 12px; align-items: baseline; }
.panel h2 .state { font: 12px ui-monospace, monospace; color: #555; }
/* a submachine's panel names the composite states it runs under */
.panel h2 .origin { font-size: 12px; font-weight: 400; color: #6b7280; }
.panel h2 .zoom { margin-left: auto; display: flex; gap: 4px; align-items: center; font-weight: 400; }
.panel h2 .zoom button { font: 12px system-ui, sans-serif; padding: 1px 7px; cursor: pointer; }
.panel h2 .zoom .level { font: 12px ui-monospace, monospace; color: #555; min-width: 4em; text-align: right; }
.panel.active h2 { color: hsl(140 65% 32%); }
/* a submachine's graph while its composite state is not active */
.panel.inactive svg { opacity: 0.4; }
.panel.inactive h2 .state { font-style: italic; }
/* the graph keeps its own size and the body scrolls: a large machine is
   read by zooming and panning, not by shrinking it to the panel */
.panel .body { overflow: auto; cursor: grab; user-select: none; }
.panel .body.dragging { cursor: grabbing; }
.panel svg { display: block; height: auto; }
.panel svg.fit { max-width: 100%; margin: 0 auto; }
#log { overflow: auto; border-left: 1px solid #ddd; background: #fff; font: 12px ui-monospace, monospace; }
#log div { padding: 2px 8px; white-space: nowrap; cursor: pointer; border-left: 3px solid transparent; }
#log div:hover { background: #f1f5f9; }
#log div.current { background: #fee2e2; border-left-color: #e0432f; }
#log div.warn { color: #b45309; }
/* the state machine's trace lines are what the graphs show, so the log
   leaves them out by default; the other lines are the surrounding context */
#log div.other { color: #6b7280; }
#log.no-traces div.step { display: none; }
#log.no-logs div.other { display: none; }
#log .ts { color: #94a3b8; margin-right: 6px; }
footer {
    display: flex; gap: 10px; align-items: center; padding: 6px 12px;
    border-top: 1px solid #ddd; background: #fff;
}
footer button { font: inherit; padding: 3px 10px; cursor: pointer; }
footer input[type=range] { flex: 1; }
#counter { font-family: monospace; min-width: 9em; text-align: right; }

/* Graphviz SVG: state nodes are <path> (box, rounded), any_state a dashed
   <path>, the initial marker an <ellipse>; edges are <path> + arrowhead
   <polygon> + label <text>. Presentation attributes lose against CSS.
   --c is set per element by mark(): green for the current step, then
   red fading through orange to pale yellow along the trail; .now marks
   age 0. */
/* the node's shape is the <path> (rounded box) or <ellipse>; the
   <polygon>s inside a node are the rules of its sectioned label */
g.node.hl > path, g.node.hl > ellipse { fill: var(--c); }
g.node.now > path { stroke: var(--hl); stroke-width: 3; }
g.node.now > text { fill: #fff; font-weight: 600; }
g.edge.hl > path { stroke: var(--c); stroke-width: var(--w); }
g.edge.hl > polygon { fill: var(--c); stroke: var(--c); }
g.edge.hl > text { fill: var(--c); font-weight: 600; }
g.edge.now > text { fill: var(--hl); }
/* a composite state (classed by fsm::writeDot) opens its submachine's
   panel; the one running its submachine now takes the run color */
g.node.composite { cursor: pointer; }
g.node.running > path { fill: var(--running); stroke: var(--run); stroke-width: 3; }
g.node.running > text { fill: #202020; font-weight: 600; }
/* a breakpoint (right-click on a state): live mode and play pause when
   the state becomes active; drawn as a red dashed border and name */
g.node.breakpoint > path, g.node.breakpoint > ellipse { stroke: #e0432f; stroke-width: 2.5; stroke-dasharray: 5 3; }
g.node.breakpoint > text:first-of-type { fill: #e0432f; }
/* the submachine's panel a click on its composite state reveals */
.panel.pulse { animation: pulse 1.6s ease-out; }
@keyframes pulse { from { box-shadow: 0 0 0 5px var(--run); } to { box-shadow: 0 0 0 0 transparent; } }
</style>
</head>
<body>
<header>
    <span class="title">fsmview</span>
    <nav id="machines" title="show or hide a machine; the shown ones stack below each other">
        <button id="every" title="show or hide every machine">none</button>
    </nav>
    <label class="muted"><input type="checkbox" id="follow" checked> follow machine</label>
    <label class="muted" title="the received log lines, in the panel on the right"><input type="checkbox" id="showlogs" checked> show logs</label>
    <label class="muted" title="leave the state machine trace lines out of the log: the graphs show them in color"><input type="checkbox" id="hidetraces" checked> hide sm-traces</label>
    <div id="status">
        <span id="current" title="tracked state of the shown machine"></span>
        <span id="source" class="muted"></span>
        <button id="live" title="follow the newest step">LIVE</button>
    </div>
</header>
<div id="warnings"></div>
<main id="main">
    <div id="graph">
        <svg id="links" xmlns="http://www.w3.org/2000/svg">
            <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <polygon points="0,0 10,5 0,10"/>
            </marker></defs>
        </svg>
    </div>
    <div id="splitter" title="drag to resize the log, double-click to reset; wheel here scrolls the graphs"></div>
    <div id="log"></div>
</main>
<footer>
    <button id="first" title="first step (Home)">|&lt;</button>
    <button id="prev" title="previous step (←)">&lt;</button>
    <button id="play" title="play / pause (space)">▶</button>
    <button id="next" title="next step (→)">&gt;</button>
    <button id="last" title="last step (End)">&gt;|</button>
    <input type="range" id="slider" min="-1" max="-1" value="-1">
    <span id="counter">- / 0</span>
    <select id="speed" title="play speed">
        <option value="real">real time</option>
        <option value="150">fast</option>
        <option value="500" selected>medium</option>
        <option value="1500">slow</option>
    </select>
</footer>
<script>
"use strict";

const VIZ_URL = "https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.js";

const ui = {};
for (const id of ["machines", "every", "follow", "showlogs", "hidetraces", "current", "source", "live", "warnings",
                  "main", "graph", "links", "splitter", "log",
                  "first", "prev", "play", "next", "last", "slider", "counter", "speed"]) {
    ui[id] = document.getElementById(id);
}

let config = null;
let lines = [];          // every log line by index, as served
let steps = [];          // the trace lines' steps by step index
let currentLine = null;  // the log <div> of the step at the cursor
const inactiveState = "(inactive)";  // shown for a submachine whose composite state is not active
let cursor = -1;         // shown step, -1 before the first
let live = false;        // cursor follows the newest step
let ended = false;       // the source is exhausted (replay, or EOF)
let playTimer = null;
const graphs = new Map(); // stem -> {data, svg, nodes: Map(name -> <g>), panel, button, state}
const shownKey = "fsmview.shown"; // the selection survives a reload
const warnings = new Set();

// --- graphs -----------------------------------------------------------------

function svgFromText(text) {
    const doc = new DOMParser().parseFromString(text, "image/svg+xml");
    return document.importNode(doc.documentElement, true);
}

let vizPromise = null;
async function svgFromDot(dot) {
    if (!vizPromise) {
        vizPromise = new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = VIZ_URL;
            script.onload = () => resolve(Viz.instance());
            script.onerror = () => reject(new Error("viz.js could not be loaded from " + VIZ_URL));
            document.head.appendChild(script);
        });
    }
    const viz = await vizPromise;
    return viz.renderSVGElement(dot);
}

async function buildGraph(data, place) {
    let svg;
    try {
        svg = data.svg ? svgFromText(data.svg) : await svgFromDot(data.dot);
    } catch (error) {
        warn(`${data.stem}: ${error.message}`);
        svg = svgFromText('<svg xmlns="http://www.w3.org/2000/svg"></svg>');
    }
    // the natural size in CSS pixels (Graphviz works in points)
    const box = (svg.getAttribute("viewBox") || "0 0 800 600").split(/[\s,]+/).map(Number);
    const natural = {width: box[2] * 96 / 72, height: box[3] * 96 / 72};
    svg.removeAttribute("width");
    svg.removeAttribute("height");
    const nodes = new Map();
    for (const title of svg.querySelectorAll("g.node > title")) {
        nodes.set(title.textContent, title.parentNode);
    }
    // its panel in the stack, tinted like a composite state when it is a
    // submachine's and naming the composite states it runs under, and its
    // toggle in the header
    const panel = document.createElement("section");
    panel.className = "panel";
    panel.classList.toggle("nested", place.depth > 0);
    const heading = document.createElement("h2");
    const name = document.createElement("span");
    name.textContent = titleOf(data);
    name.title = "in the graph: drag pans, the wheel zooms, a click on a composite state reveals its "
               + "submachine, a right-click on a state sets a breakpoint (live mode and play pause there)";
    const state = document.createElement("span");
    state.className = "state";
    const origin = document.createElement("span");
    origin.className = "origin";
    origin.textContent = place.parents.map(parent => `↳ ${titleOf(parent.data)} › ${parent.state}`).join(", ");
    const zoomBox = document.createElement("span");
    zoomBox.className = "zoom";
    const level = document.createElement("span");
    level.className = "level";
    for (const [text, action, hint] of [["\u2212", () => zoomBy(data.stem, 1 / 1.25), "zoom out (or wheel over the graph)"],
                                        ["+", () => zoomBy(data.stem, 1.25), "zoom in (or wheel over the graph)"],
                                        ["fit", () => setZoom(data.stem, "fit"), "fit the panel width"],
                                        ["1:1", () => setZoom(data.stem, 1), "natural size"]]) {
        const control = document.createElement("button");
        control.textContent = text;
        control.title = hint;
        control.addEventListener("click", action);
        zoomBox.appendChild(control);
    }
    zoomBox.appendChild(level);
    heading.append(name, state, origin, zoomBox);
    const body = document.createElement("div");
    body.className = "body";
    body.appendChild(svg);
    // wheel zooms around the pointer, click and drag pans: sideways within
    // the body, up and down through the stack (the body is as tall as its
    // graph and never scrolls vertically)
    body.addEventListener("wheel", event => {
        event.preventDefault();
        zoomBy(data.stem, event.deltaY < 0 ? 1.1 : 1 / 1.1, event);
    }, {passive: false});
    // A click (a press without a drag) on a composite state reveals its
    // submachine's panel; the capture sends the release to the body, so
    // the node is taken at the press
    let drag = null;
    body.addEventListener("pointerdown", event => {
        if (event.button === 2) {
            const node = event.target.closest("g.node");
            const name = node && node.querySelector("title").textContent;
            if (data.states.includes(name)) toggleBreakpoint(data.stem, name);
            return;
        }
        if (event.button !== 0) return;
        drag = {x: event.clientX, y: event.clientY, left: body.scrollLeft, top: ui.graph.scrollTop,
                moved: false, composite: event.target.closest("g.node.composite")};
        body.setPointerCapture(event.pointerId);
        body.classList.add("dragging");
        event.preventDefault();
    });
    body.addEventListener("pointermove", event => {
        if (!drag) return;
        const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
        if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
        body.scrollLeft = drag.left - dx;
        ui.graph.scrollTop = drag.top - dy;
    });
    body.addEventListener("pointerup", () => {
        if (drag && !drag.moved && drag.composite) {
            const child = data.children[drag.composite.querySelector("title").textContent];
            if (graphs.has(child)) reveal(child);
        }
        drag = null;
        body.classList.remove("dragging");
    });
    body.addEventListener("pointercancel", () => { drag = null; body.classList.remove("dragging"); });
    body.addEventListener("contextmenu", event => event.preventDefault()); // the right button sets breakpoints
    panel.append(heading, body);
    ui.graph.appendChild(panel);

    const button = document.createElement("button");
    button.textContent = `${"›".repeat(place.depth)} ${titleOf(data)}`.trim();
    button.addEventListener("click", () => setShown(data.stem, panel.hidden));
    ui.machines.appendChild(button);

    graphs.set(data.stem, {data, svg, nodes, panel, button, state, body, level, natural, zoom: "fit"});
    setZoom(data.stem, savedZoom(data.stem));
    resized.observe(svg);
}

// --- zoom: "fit" scales the graph to the panel width, a number is the
// factor of its natural size; remembered per machine ------------------------

const zoomKey = "fsmview.zoom";

function savedZoom(stem) {
    try {
        const saved = JSON.parse(localStorage.getItem(zoomKey)) || {};
        const zoom = saved[stem];
        return zoom === "fit" || (typeof zoom === "number" && zoom > 0) ? zoom : "fit";
    } catch (error) {
        return "fit";
    }
}

function setZoom(stem, zoom) {
    const graph = graphs.get(stem);
    if (!graph) return;
    graph.zoom = zoom;
    if (zoom === "fit") {
        graph.svg.classList.add("fit");
        graph.svg.style.width = "";
        graph.level.textContent = "fit";
    } else {
        graph.svg.classList.remove("fit");
        graph.svg.style.width = `${Math.round(graph.natural.width * zoom)}px`;
        graph.level.textContent = `${Math.round(zoom * 100)}%`;
    }
    try {
        const saved = JSON.parse(localStorage.getItem(zoomKey)) || {};
        saved[stem] = zoom;
        localStorage.setItem(zoomKey, JSON.stringify(saved));
    } catch (error) { /* no storage: the zoom lives for this page only */ }
}

// A step from "fit" starts at the factor the fit currently shows. With
// a pointer event as anchor the point under the pointer stays put
function zoomBy(stem, factor, anchor = null) {
    const graph = graphs.get(stem);
    if (!graph) return;
    const current = graph.zoom === "fit" ? graph.svg.getBoundingClientRect().width / graph.natural.width : graph.zoom;
    const next = Math.min(8, Math.max(0.1, current * factor));
    const body = graph.body;
    const rect = body.getBoundingClientRect();
    const at = anchor ? {x: anchor.clientX - rect.left, y: anchor.clientY - rect.top}
                      : {x: rect.width / 2, y: rect.height / 2};
    const content = {x: body.scrollLeft + at.x, y: body.scrollTop + at.y};
    setZoom(stem, next);
    const ratio = next / current;
    body.scrollLeft = content.x * ratio - at.x;
    body.scrollTop = content.y * ratio - at.y;
}

function setShown(stem, on) {
    const graph = graphs.get(stem);
    if (!graph) return;
    graph.panel.hidden = !on;
    graph.button.classList.toggle("shown", on);
    ui.every.textContent = someHidden() ? "all" : "none";
    try {
        localStorage.setItem(shownKey, JSON.stringify([...graphs.keys()].filter(s => !graphs.get(s).panel.hidden)));
    } catch (error) { /* no storage: the selection lives for this page only */ }
}

function someHidden() {
    return [...graphs.values()].some(graph => graph.panel.hidden);
}

// Every machine shown, unless a saved selection names some of them
function restoreShown() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(shownKey)); } catch (error) { saved = null; }
    const known = Array.isArray(saved) ? saved.filter(stem => graphs.has(stem)) : [];
    for (const stem of graphs.keys()) setShown(stem, known.length === 0 || known.includes(stem));
}

function titleOf(data) {
    return data.table && data.table !== data.name ? `${data.name} (${data.table})` : data.name;
}

// A submachine's panel shown, scrolled to and lit up for a moment
function reveal(stem) {
    const panel = graphs.get(stem).panel;
    setShown(stem, true);
    panel.scrollIntoView({block: "start", behavior: "smooth"});
    panel.classList.remove("pulse");
    void panel.offsetWidth; // restarts the animation on a second click
    panel.classList.add("pulse");
}

// --- breakpoints -----------------------------------------------------------

// A state marked by a right-click: live mode and play pause at the step
// that makes it active. The marks are remembered by the browser
const breakpointsKey = "fsmview.breakpoints";
const breakpoints = new Set(); // "<stem>\n<state>"

function breakpointKey(stem, state) {
    return `${stem}\n${state}`;
}

function toggleBreakpoint(stem, state) {
    const key = breakpointKey(stem, state);
    if (breakpoints.has(key)) breakpoints.delete(key); else breakpoints.add(key);
    const node = graphs.get(stem).nodes.get(state);
    if (node) node.classList.toggle("breakpoint", breakpoints.has(key));
    try {
        const saved = {};
        for (const entry of breakpoints) {
            const [graph, name] = entry.split("\n");
            (saved[graph] = saved[graph] || []).push(name);
        }
        localStorage.setItem(breakpointsKey, JSON.stringify(saved));
    } catch (error) { /* no storage: the marks live for this page only */ }
}

function restoreBreakpoints() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(breakpointsKey)) || {}; } catch (error) { saved = {}; }
    for (const [stem, graph] of graphs) {
        for (const state of saved[stem] || []) {
            if (graph.nodes.has(state) && !breakpoints.has(breakpointKey(stem, state))) toggleBreakpoint(stem, state);
        }
    }
}

function hitsBreakpoint(step) {
    return !!step && breakpoints.has(breakpointKey(step.graph, step.state));
}

// The graphs in tree order: a root, then each submachine's graph right
// below its parent, one level deeper; a sub-table two composites share
// sits below the first of them and names both. Answers {data, depth,
// parents: [{data, state}]} per graph
function hierarchy(datas) {
    const byStem = new Map(datas.map(data => [data.stem, data]));
    const parents = new Map(datas.map(data => [data.stem, []]));
    for (const data of datas) {
        for (const [state, child] of Object.entries(data.children)) {
            if (parents.has(child)) parents.get(child).push({data, state});
        }
    }
    const order = [];
    const placed = new Set();
    const place = (data, depth) => {
        if (placed.has(data.stem)) return;
        placed.add(data.stem);
        order.push({data, depth, parents: parents.get(data.stem)});
        for (const child of Object.values(data.children)) {
            if (byStem.has(child)) place(byStem.get(child), depth + 1);
        }
    };
    for (const data of datas) if (parents.get(data.stem).length === 0) place(data, 0);
    for (const data of datas) place(data, 0); // graphs nesting each other in a cycle
    return order;
}

// --- highlighting -----------------------------------------------------------

function clearHighlights() {
    for (const graph of graphs.values()) {
        for (const element of graph.svg.querySelectorAll(".hl")) {
            element.classList.remove("hl", "now");
            element.style.removeProperty("--c");
            element.style.removeProperty("--w");
        }
    }
}

// Age 0 is green; the trail starts at half-strength red right behind it
// (never darker than a 50% tint) and steps through orange to a pale
// yellow, hue and lightness both moving per step so neighbouring ages
// stay apart
function trailColor(age) {
    if (age === 0) return "hsl(140 65% 42%)";
    const t = Math.min(1, (age - 1) / Math.max(1, config.history - 2));
    const hue = 0 + 55 * t;
    const saturation = 85 - 25 * t;
    const lightness = 74 + 22 * t;
    return `hsl(${hue.toFixed(0)} ${saturation.toFixed(0)}% ${lightness.toFixed(0)}%)`;
}

function mark(element, age) {
    if (!element || element.classList.contains("hl")) return; // newer step wins
    element.classList.add("hl");
    if (age === 0) element.classList.add("now");
    element.style.setProperty("--c", trailColor(age));
    element.style.setProperty("--w", age === 0 ? "3.5" : (2.5 - 1.5 * age / config.history).toFixed(2));
}

// A parent's step that leaves a composite state ends the child's graph:
// older highlights there are stale until the child's next line
function render() {
    clearHighlights();
    const remaining = new Map([...graphs.keys()].map(stem => [stem, config.history]));
    const inactive = new Set();
    for (let i = cursor; i >= 0; i--) {
        const step = steps[i];
        if (!step) continue;
        for (const stem of step.deactivates || []) {
            if (remaining.get(stem) === config.history && !inactive.has(stem)) {
                inactive.add(stem);
                remaining.set(stem, 0);
            }
        }
        if (!step.graph) continue;
        const left = remaining.get(step.graph);
        if (!left) continue;
        const graph = graphs.get(step.graph);
        const age = config.history - left;
        mark(graph.nodes.get(step.state), age);
        for (const id of step.edges) {
            for (const edge of graph.svg.querySelectorAll(`g.edge[id="${CSS.escape(id)}"]`)) {
                mark(edge, age);
            }
        }
        remaining.set(step.graph, left - 1);
    }
    const step = steps[cursor];
    for (const graph of graphs.values()) {
        graph.panel.classList.toggle("active", !!step && step.graph === graph.data.stem);
        graph.panel.classList.toggle("inactive", inactive.has(graph.data.stem));
    }
    if (step && step.graph && ui.follow.checked) {
        const graph = graphs.get(step.graph);
        if (graph.panel.hidden) setShown(step.graph, true);
        graph.panel.scrollIntoView({block: "nearest"});
    }
    ui.slider.max = steps.length - 1;
    ui.slider.value = cursor;
    ui.counter.textContent = `${cursor + 1} / ${steps.length}`;
    if (currentLine) currentLine.classList.remove("current");
    currentLine = step ? step.div : null;
    if (currentLine) {
        currentLine.classList.add("current");
        currentLine.scrollIntoView({block: "nearest"});
    }
    renderPath(renderStatus());
}

// The tracked state of every machine at the cursor, on its panel; the
// current step's machine in the header. Answers the states by stem
function renderStatus() {
    const pending = new Map([...graphs.keys()].map(stem => [stem, null]));
    let open = pending.size;
    for (let i = cursor; i >= 0 && open > 0; i--) {
        const step = steps[i];
        if (!step) continue;
        for (const stem of step.deactivates || []) {
            if (pending.get(stem) === null) {
                pending.set(stem, inactiveState);
                open--;
            }
        }
        if (step.graph && pending.get(step.graph) === null) {
            pending.set(step.graph, step.state);
            open--;
        }
    }
    const states = new Map();
    for (const [stem, graph] of graphs) {
        states.set(stem, pending.get(stem) ?? graph.data.initial ?? "?");
        graph.state.textContent = states.get(stem);
    }
    const step = steps[cursor];
    const graph = step && graphs.get(step.graph);
    ui.current.textContent = graph ? `${graph.data.table || graph.data.name}: ${step.state}` : "";
    ui.live.classList.toggle("on", live);
    ui.live.disabled = ended;
    return states;
}

// --- the path of the events ---------------------------------------------------

// A composite state whose submachine runs now takes the run color, as
// does the submachine's panel, and a line leads from the state to the
// submachine's state: where the events go now, root downwards. The
// lines are redrawn whenever something moves
let links = [];  // [{from: <g>, to: <g>}]

function renderPath(states) {
    for (const graph of graphs.values()) {
        for (const node of graph.svg.querySelectorAll("g.node.running")) node.classList.remove("running");
        graph.panel.classList.remove("running");
    }
    links = [];
    for (const [stem, graph] of graphs) {
        const child = graph.data.children[states.get(stem)];
        if (!graphs.has(child) || states.get(child) === inactiveState) continue;
        const from = graph.nodes.get(states.get(stem));
        const to = graphs.get(child).nodes.get(states.get(child));
        if (!from || !to) continue;
        from.classList.add("running");
        graphs.get(child).panel.classList.add("running");
        links.push({from, to});
    }
    drawLinks();
}

// A node's anchor in the overlay's coordinates: the overlay scrolls with
// the stack, so a client point maps through the stack's scroll offset.
// The node stays within its panel body horizontally, which is where a
// scrolled-away node would be seen; null for a node in a hidden panel
function anchor(node, side) {
    const rect = node.getBoundingClientRect();
    if (rect.width === 0) return null;
    const visible = node.closest(".body").getBoundingClientRect();
    const stack = ui.graph.getBoundingClientRect();
    const x = Math.min(Math.max(rect.left + rect.width / 2, visible.left), visible.right);
    const y = side === "bottom" ? rect.bottom : rect.top;
    return {x: x - stack.left + ui.graph.scrollLeft, y: y - stack.top + ui.graph.scrollTop};
}

function drawLinks() {
    for (const path of ui.links.querySelectorAll("path")) path.remove();
    for (const {from, to} of links) {
        const a = anchor(from, "bottom");
        const b = anchor(to, "top");
        if (!a || !b) continue;
        const middle = (a.y + b.y) / 2;
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", `M${a.x},${a.y} C${a.x},${middle} ${b.x},${middle} ${b.x},${b.y}`);
        path.setAttribute("marker-end", "url(#arrow)");
        ui.links.appendChild(path);
    }
}

let linksScheduled = false;
function scheduleLinks() {
    if (linksScheduled) return;
    linksScheduled = true;
    requestAnimationFrame(() => { linksScheduled = false; drawLinks(); });
}

// what moves a node: a panel body panning (scroll events do not bubble -
// taken in the capture phase), a zoom, a panel shown or hidden or the
// stack resized (the sizes change)
ui.graph.addEventListener("scroll", scheduleLinks, true);
const resized = new ResizeObserver(scheduleLinks);
resized.observe(ui.graph);

// --- steps and the log list -------------------------------------------------

// Every received line goes into the log list; a trace line also becomes
// a step. Clicking a line jumps to its step, or to the last step before it
function addLine(entry) {
    lines[entry.i] = entry;
    const div = document.createElement("div");
    div.textContent = entry.raw;
    const step = entry.step;
    if (step) {
        steps[step.i] = step;
        step.div = div;
        div.classList.add("step");
        if (step.warnings.length) {
            div.classList.add("warn");
            div.title = step.warnings.join("\n");
            for (const message of step.warnings) warn(message);
        }
    } else {
        div.classList.add("other");
    }
    div.addEventListener("click", () => { setLive(false); goTo(step ? step.i : stepBefore(entry.i)); });
    ui.log.appendChild(div);
}

// The index of the last step at or before a log line, -1 if none
function stepBefore(lineIndex) {
    for (let i = lineIndex; i >= 0; i--) {
        if (lines[i] && lines[i].step) return lines[i].step.i;
    }
    return -1;
}

// the log's two filters: "show logs" shows the received lines, "hide
// sm-traces" leaves the state machine's trace lines out of them (the
// graphs show those); both are on by default and survive a reload. With
// nothing left to show the log panel folds away and the graphs take its room
const logFilters = {showlogs: {key: "fsmview.showLogs", hiding: "no-logs", hidesWhenChecked: false},
                    hidetraces: {key: "fsmview.hideTraces", hiding: "no-traces", hidesWhenChecked: true}};

function setFilter(filter, checked) {
    const {key, hiding, hidesWhenChecked} = logFilters[filter];
    ui[filter].checked = checked;
    ui.log.classList.toggle(hiding, checked === hidesWhenChecked);
    ui.main.classList.toggle("no-log", !ui.showlogs.checked && ui.hidetraces.checked);
    try { localStorage.setItem(key, checked ? "1" : "0"); } catch (error) { /* page-local */ }
    if (currentLine) currentLine.scrollIntoView({block: "nearest"});
}

function savedFilter(filter) {
    try {
        const saved = localStorage.getItem(logFilters[filter].key);
        return saved === null || saved === "1";
    } catch (error) { return true; }
}

function warn(message) {
    if (warnings.has(message)) return;
    warnings.add(message);
    ui.warnings.textContent = [...warnings].join("\n");
    ui.warnings.style.display = "block";
}

function goTo(index) {
    cursor = Math.max(-1, Math.min(steps.length - 1, index));
    render();
}

function setLive(on) {
    live = on && !ended;
    if (live) {
        stopPlaying();
        goTo(steps.length - 1);
    } else {
        renderStatus();
    }
}

// --- playback ---------------------------------------------------------------

function playDelay() {
    const speed = ui.speed.value;
    if (speed !== "real") return Number(speed);
    const current = steps[cursor], next = steps[cursor + 1];
    if (!current || !next || current.ts === null || next.ts === null) return 500;
    return Math.min(5000, Math.max(20, (next.ts - current.ts) * 1000));
}

function stopPlaying() {
    clearTimeout(playTimer);
    playTimer = null;
    ui.play.textContent = "▶";
}

function playStep() {
    if (cursor >= steps.length - 1) {
        stopPlaying();
        if (config.mode === "live" && !ended) setLive(true);
        return;
    }
    goTo(cursor + 1);
    if (hitsBreakpoint(steps[cursor])) {
        stopPlaying();
        return;
    }
    playTimer = setTimeout(playStep, playDelay());
}

function togglePlay() {
    if (playTimer) {
        stopPlaying();
    } else {
        setLive(false);
        ui.play.textContent = "❚❚";
        playTimer = setTimeout(playStep, playDelay());
    }
}

// --- live stream ------------------------------------------------------------

function openStream(from) {
    const stream = new EventSource(`/stream?from=${from}`);
    stream.onmessage = event => {
        const entry = JSON.parse(event.data);
        addLine(entry);
        if (!entry.step) return;
        if (live && hitsBreakpoint(entry.step)) {
            setLive(false);
            goTo(entry.step.i);
        } else if (live) {
            goTo(entry.step.i);
        } else {
            render();
        }
    };
    stream.addEventListener("end", () => {
        stream.close();
        ended = true;
        live = false;
        ui.source.textContent += " (ended)";
        renderStatus();
    });
    stream.onerror = () => renderStatus();
}

// --- the log's width: a splitter, remembered by the browser -----------------

const logWidthKey = "fsmview.logWidth";

function setLogWidth(pixels) {
    const width = Math.round(Math.min(window.innerWidth * 0.8, Math.max(160, pixels)));
    document.documentElement.style.setProperty("--log-width", `${width}px`);
    try { localStorage.setItem(logWidthKey, String(width)); } catch (error) { /* page-local then */ }
}

try {
    const saved = Number(localStorage.getItem(logWidthKey));
    if (saved > 0) setLogWidth(saved);
} catch (error) { /* default width */ }

ui.splitter.addEventListener("pointerdown", event => {
    ui.splitter.setPointerCapture(event.pointerId);
    ui.splitter.classList.add("dragging");
    event.preventDefault();
});
ui.splitter.addEventListener("pointermove", event => {
    if (!ui.splitter.classList.contains("dragging")) return;
    setLogWidth(window.innerWidth - event.clientX - ui.splitter.offsetWidth / 2);
});
for (const end of ["pointerup", "pointercancel"]) {
    ui.splitter.addEventListener(end, () => ui.splitter.classList.remove("dragging"));
}
ui.splitter.addEventListener("dblclick", () => setLogWidth(360));
ui.splitter.addEventListener("wheel", event => {
    ui.graph.scrollBy({top: event.deltaY, left: event.deltaX});
    event.preventDefault();
}, {passive: false});

// --- controls ---------------------------------------------------------------

ui.first.addEventListener("click", () => { setLive(false); stopPlaying(); goTo(0); });
ui.prev.addEventListener("click", () => { setLive(false); stopPlaying(); goTo(cursor - 1); });
ui.next.addEventListener("click", () => { setLive(false); stopPlaying(); goTo(cursor + 1); });
ui.last.addEventListener("click", () => {
    stopPlaying();
    if (config.mode === "live" && !ended) setLive(true); else goTo(steps.length - 1);
});
ui.play.addEventListener("click", togglePlay);
ui.live.addEventListener("click", () => setLive(!live));
ui.slider.addEventListener("input", () => { setLive(false); stopPlaying(); goTo(Number(ui.slider.value)); });
ui.follow.addEventListener("change", render);
for (const filter of Object.keys(logFilters)) {
    ui[filter].addEventListener("change", () => setFilter(filter, ui[filter].checked));
    setFilter(filter, savedFilter(filter));
}
ui.every.addEventListener("click", () => {
    const on = someHidden();
    for (const stem of graphs.keys()) setShown(stem, on);
});
document.addEventListener("keydown", event => {
    if (event.target.tagName === "SELECT" || event.target.tagName === "INPUT") return;
    const actions = {ArrowLeft: ui.prev, ArrowRight: ui.next, Home: ui.first, End: ui.last, " ": ui.play};
    const button = actions[event.key];
    if (button) { event.preventDefault(); button.click(); }
});

// --- start ------------------------------------------------------------------

async function init() {
    config = await (await fetch("/state")).json();
    ui.source.textContent = config.mode === "replay" ? `replay ${config.source}` : config.source;
    for (const message of config.warnings) warn(message);
    for (const place of hierarchy(config.graphs)) {
        await buildGraph(place.data, place);
    }
    restoreShown();
    restoreBreakpoints();

    const events = await (await fetch("/events?from=0")).json();
    for (const entry of events.lines) addLine(entry);
    ended = events.ended;
    if (config.mode === "live" && !ended) {
        live = true;
        openStream(lines.length);
    } else if (config.mode === "replay") {
        ui.source.textContent += " (ended)";
    }
    goTo(config.mode === "replay" ? 0 : steps.length - 1);
}

init().catch(error => warn(error.message));
</script>
</body>
</html>
